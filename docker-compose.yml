services:
  gateway-backend:
    build: ./backend
    container_name: gateway-backend-prod
    ports: 
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - XENOVA_CACHE_DIR=/app/models_cache
    volumes:
      - hf_models_cache:/app/models_cache
    depends_on:
      - vector-db
  gateway-frontend:
    build: ./frontend
    container_name: gateway-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - gateway-backend
  vector-db:
    image: qdrant/qdrant:v1.20.0
    container_name: enterprise-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  hf_models_cache:
